workflows:
  ios-testflight:
    name: DV Gravures iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: DV Gravures App Store Connect

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: be.dvgravures.mobile
      vars:
        BUNDLE_ID: be.dvgravures.mobile
        APP_DISPLAY_NAME: DV Gravures
        APP_VERSION: 0.3.0

    scripts:
      - name: Flutter packages ophalen
        script: |
          flutter pub get

      - name: iOS-project genereren indien nodig
        script: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios .
          fi

      - name: iOS releaseconfiguratie voorbereiden
        script: |
          flutter build ios --release --config-only --no-codesign

      - name: iOS-app en privacyrechten configureren
        script: |
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          INFO="ios/Runner/Info.plist"

          # Bundle identifier instellen.
          sed -i '' -E "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/g" "$PBXPROJ"

          # Gebruik Python plistlib zodat de echte XML plist betrouwbaar wordt aangepast.
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          path = Path("ios/Runner/Info.plist")
          with path.open("rb") as f:
              data = plistlib.load(f)

          data["CFBundleDisplayName"] = "DV Gravures"
          data["NSCameraUsageDescription"] = (
              "DV Gravures gebruikt de camera om foto's rechtstreeks aan een opdracht toe te voegen."
          )
          data["NSMicrophoneUsageDescription"] = (
              "DV Gravures gebruikt geen audio bij foto's; deze toestemming is vereist door de camera-integratie."
          )
          data["NSPhotoLibraryUsageDescription"] = (
              "DV Gravures gebruikt de fotobibliotheek om foto's aan een opdracht toe te voegen."
          )
          data["NSPhotoLibraryAddUsageDescription"] = (
              "DV Gravures gebruikt Foto's om afbeeldingen aan een opdracht toe te voegen."
          )
          data["PHPhotoLibraryPreventAutomaticLimitedAccessAlert"] = True
          data["ITSAppUsesNonExemptEncryption"] = False

          with path.open("wb") as f:
              plistlib.dump(data, f, fmt=plistlib.FMT_XML, sort_keys=False)
          PY

          echo "Info.plist vóór build:"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$INFO"
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$INFO"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" "$INFO"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryAddUsageDescription" "$INFO"

      - name: Pods installeren
        script: |
          cd ios
          pod install
          cd ..

      - name: Code signing toepassen
        script: |
          xcode-project use-profiles \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'

      - name: IPA bouwen
        script: |
          flutter build ipa --release \
            --build-name="${APP_VERSION}" \
            --build-number="${BUILD_NUMBER}" \
            --export-options-plist=/Users/builder/export_options.plist

      - name: Privacyrechten in definitieve IPA controleren
        script: |
          IPA="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | head -1)"
          test -n "$IPA"

          rm -rf /tmp/dv_ipa_check
          mkdir -p /tmp/dv_ipa_check
          unzip -q "$IPA" -d /tmp/dv_ipa_check

          APP_PLIST="/tmp/dv_ipa_check/Payload/Runner.app/Info.plist"
          test -f "$APP_PLIST"

          echo "NSCameraUsageDescription in definitieve app:"
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$APP_PLIST"

          echo "NSMicrophoneUsageDescription in definitieve app:"
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$APP_PLIST"

          echo "NSPhotoLibraryUsageDescription in definitieve app:"
          /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" "$APP_PLIST"

          # Expliciet falen wanneer een vereiste sleutel ontbreekt.
          /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$APP_PLIST" >/dev/null
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$APP_PLIST" >/dev/null

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
