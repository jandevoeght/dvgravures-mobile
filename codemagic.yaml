workflows:
  ios-testflight:
    name: DV Gravures iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: DV Gravures App Store Connect

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: be.dvgravures.mobile
      vars:
        BUNDLE_ID: be.dvgravures.mobile
        APP_DISPLAY_NAME: DV Gravures
        APP_VERSION: 0.1.3

    scripts:
      - name: Flutter packages ophalen
        script: |
          flutter pub get

      - name: iOS-project genereren indien nodig
        script: |
          if [ ! -d "ios" ]; then
            flutter create --platforms=ios .
          fi

      - name: iOS-app configureren
        script: |
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          INFO="ios/Runner/Info.plist"

          # Bundle identifier instellen.
          sed -i '' -E "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]+;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/g" "$PBXPROJ"

          # Zichtbare appnaam.
          /usr/libexec/PlistBuddy -c "Delete :CFBundleDisplayName" "$INFO" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string ${APP_DISPLAY_NAME}" "$INFO"

          # Toestemmingen voor camera en fotobibliotheek.
          /usr/libexec/PlistBuddy -c "Delete :NSCameraUsageDescription" "$INFO" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string DV Gravures gebruikt de camera om foto's rechtstreeks aan een opdracht toe te voegen." "$INFO"

          /usr/libexec/PlistBuddy -c "Delete :NSPhotoLibraryUsageDescription" "$INFO" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string DV Gravures gebruikt de fotobibliotheek om foto's aan een opdracht toe te voegen." "$INFO"

          /usr/libexec/PlistBuddy -c "Delete :NSPhotoLibraryAddUsageDescription" "$INFO" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string DV Gravures gebruikt Foto’s om afbeeldingen aan een opdracht toe te voegen." "$INFO"

          # Voorkom een automatische beperkte-toegangsmelding van iOS; de app toont zelf fouten/toestemmingsinformatie.
          /usr/libexec/PlistBuddy -c "Delete :PHPhotoLibraryPreventAutomaticLimitedAccessAlert" "$INFO" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :PHPhotoLibraryPreventAutomaticLimitedAccessAlert bool true" "$INFO"

          # De app implementeert zelf geen niet-vrijgestelde encryptie.
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$INFO" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$INFO"

      - name: Pods installeren
        script: |
          cd ios
          pod install
          cd ..

      - name: Code signing toepassen
        script: |
          xcode-project use-profiles \
            --custom-export-options='{"testFlightInternalTestingOnly": true}'

      - name: IPA bouwen
        script: |
          flutter build ipa --release \
            --build-name="${APP_VERSION}" \
            --build-number="${BUILD_NUMBER}" \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
